[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-runtime"
version = "0.1.0"
description = "A transparent multi-agent runtime: an orchestrator routing to specialist agents (starting with email) over an explicit ReAct-style loop, served with FastAPI/uvicorn."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gurpiyar Singh" }]
keywords = ["agent", "multi-agent", "orchestrator", "email", "langchain", "openai", "fastapi"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langchain-core>=0.3.29",
    "langchain-openai>=1.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "youtube-transcript-api>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
agent-runtime = "agent_runtime.__main__:main"
agent-runtime-repl = "agent_runtime.cli:main"

[project.urls]
Repository = "https://github.com/your-org/agent-runtime"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]
# Ship the web UI assets inside the wheel, not just the .py files.
artifacts = ["src/agent_runtime/web/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# Agent prompts are prose. Hard-wrapping them would put newlines inside the
# instructions themselves, so the line limit does not apply to those modules.
"src/agent_runtime/agents/*_agent.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["agent_runtime"]
mypy_path = "src"
strict = true
warn_unused_ignores = false
disallow_untyped_decorators = false
ignore_missing_imports = true
