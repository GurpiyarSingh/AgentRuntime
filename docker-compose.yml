# Runs the whole Agent Runtime stack: the API and the web app.
#
#   docker compose up --build -d      then open http://localhost:8080
#   docker compose logs -f            follow the logs
#   docker compose down               stop (the workspace volume is kept)
#
# Settings come from agent-runtime-backend/.env (OPENAI_API_KEY at least).

name: agent-runtime

services:
  backend:
    build: ./agent-runtime-backend
    image: agent-runtime-backend:latest
    env_file:
      - path: ./agent-runtime-backend/.env
        required: false
    volumes:
      # Uploads and every file the agent creates; survives `down` and rebuilds.
      - workspace:/data/workspace
    restart: unless-stopped
    # Not published: the web app proxies /v1 and /health to it. Uncomment to
    # call the API directly from this machine (scripts, the CLI, /docs).
    # ports:
    #   - "127.0.0.1:8000:8000"

  frontend:
    build: ./agent-runtime-frontend
    image: agent-runtime-frontend:latest
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      # This machine only. To serve other computers, change to "8080:8080",
      # and set API_KEY in the backend's .env first: without it, anyone who
      # can reach the page can read, upload and delete workspace files.
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  workspace:
