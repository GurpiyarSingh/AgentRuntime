# Runs the whole Agent Runtime stack: the API and the web app.
#
#   docker compose up --build -d      then open http://localhost:8080
#   docker compose logs -f            follow the logs
#   docker compose down               stop (the workspace volume is kept)
#
# Settings come from agent-runtime-backend/.env (OPENAI_API_KEY at least).
# Compose-only values (DOCKER_DATABASE_URL) come from a .env file next to this
# one, which is git-ignored.

name: agent-runtime

services:
  backend:
    build: ./agent-runtime-backend
    image: agent-runtime-backend:latest
    env_file:
      - path: ./agent-runtime-backend/.env
        required: false
    environment:
      # Inside the container "localhost" is the container itself, so the
      # backend .env's DATABASE_URL (localhost:5432) can't be used as is.
      # To store sessions in PostgreSQL on this machine, put this in ./.env:
      #   DOCKER_DATABASE_URL=postgresql://USER:PASSWORD@host.docker.internal:5432/agent_runtime
      # Unset = sessions are kept in memory only.
      DATABASE_URL: ${DOCKER_DATABASE_URL:-}
      # The web app's nginx is the only client and passes on the browser's
      # address in X-Forwarded-For; trust it so sessions record real client
      # IPs. (Remove this if you publish port 8000 below: any caller could
      # then claim any address.)
      FORWARDED_ALLOW_IPS: "*"
    extra_hosts:
      # Docker Desktop provides host.docker.internal; this adds it on Linux.
      - "host.docker.internal:host-gateway"
    volumes:
      # Uploads and every file the agent creates; survives `down` and rebuilds.
      - workspace:/data/workspace
      # MCP servers added in the web app (and their tokens); kept outside
      # /data so the agent can never read it.
      - config:/config
      # The web app's folder picker browses /data inside the container, not
      # this machine. To let the agent work in your own folders, mount them
      # under /data, e.g.:
      # - ~/projects:/data/projects
    restart: unless-stopped
    # Not published: the web app proxies /v1 and /health to it. Uncomment to
    # call the API directly from this machine (scripts, the CLI, /docs).
    # ports:
    #   - "127.0.0.1:8000:8000"

  frontend:
    build: ./agent-runtime-frontend
    image: agent-runtime-frontend:latest
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      # This machine only. To serve other computers, change to "8080:8080",
      # and set API_KEY in the backend's .env first: without it, anyone who
      # can reach the page can read, upload and delete workspace files.
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Optional: a browser for the agent, through Playwright's MCP server.
  # Browsers are too heavy for the backend image, so Playwright runs in its
  # own. Uncomment, `docker compose up -d`, then in the web app add an MCP
  # server of type HTTP with the URL http://playwright:8931/mcp
  # playwright:
  #   image: mcr.microsoft.com/playwright/mcp
  #   command: ["--headless", "--port", "8931", "--host", "0.0.0.0"]
  #   restart: unless-stopped

volumes:
  workspace:
  config:
