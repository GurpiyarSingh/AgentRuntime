[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-runtime"
version = "0.2.0"
description = "A backend-only agent runtime: a transparent ReAct-style loop with built-in tools for reading, viewing and creating files of any type, served with FastAPI/uvicorn."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gurpiyar Singh" }]
keywords = ["agent", "runtime", "tools", "langchain", "openai", "fastapi"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langchain-core>=0.3.29",
    "langchain-openai>=1.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    # Persistent sessions and run activity (when DATABASE_URL is set).
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    # MCP client: connect Model Context Protocol servers (stdio, HTTP, SSE).
    "mcp>=1.12,<2",
    # File formats the default tools read and write.
    "pillow>=11.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "fpdf2>=2.8",
]

[project.optional-dependencies]
# HEIC/HEIF images (e.g. iPhone photos) for read_image.
heic = ["pillow-heif>=0.18"]
dev = [
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
agent-runtime = "agent_runtime.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC",
    "D",     # docstrings on every public module, class and function
    "S",     # bandit security checks
    "BLE",   # no blind `except Exception` without a reason
    "LOG", "G",  # logging: lazy formatting, right logger calls
    "PT",    # pytest style
    "RET", "PIE", "PERF", "T20", "ERA",
]
ignore = [
    "B008",  # FastAPI Depends()/File()/Form() in defaults is idiomatic
    "D105",  # dunder methods are self-describing
    "D107",  # __init__ is documented on the class or the method, not both
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests document intent through their names; asserts are the point.
"tests/*" = ["D", "S101", "S108"]
# The system prompt is prose. Hard-wrapping it would put newlines inside the
# instructions themselves, so the line limit does not apply to that module.
"src/agent_runtime/runtime.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["agent_runtime"]
mypy_path = "src"
strict = true
warn_unused_ignores = false
disallow_untyped_decorators = false
ignore_missing_imports = true
